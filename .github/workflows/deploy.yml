name: Deploy
on:
  push:
    branches:
      - this-is-an-example-github-workflow-file-to-run-terraform
      # - main
  workflow_dispatch:

# Don't allow multiple deploys for the same branch
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read

    env:
      GCP_PROJECT_ID: "k8tre-dev-project"
      GCP_PROJECT_NUMBER: "000000000000"
      GCP_REGION: europe-west2
      GITHUB_OIDC_POOL: k8tre-dev-github-pool
      GITHUB_OIDC_SERVICE_ACCOUNT: k8tre-dev-gke-admin@k8tre-dev-project.iam.gserviceaccount.com
      # TERRAFORM_DEPLOY_COMMAND: plan
      TERRAFORM_DEPLOY_COMMAND: "apply -auto-approve"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.GITHUB_OIDC_POOL }}/providers/github-provider"
          service_account: "${{ env.GITHUB_OIDC_SERVICE_ACCOUNT }}"

      - name: Initialise Terraform
        run: |
          terraform init
          terraform validate

      - name: Deploy
        run: |
          if [ "${GITHUB_REF}" == main ]; then
            terraform $TERRAFORM_DEPLOY_COMMAND
          else
            terraform plan
          fi
